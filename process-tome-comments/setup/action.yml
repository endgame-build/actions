name: 'tome-comments setup'
description: 'Shared preamble for process-tome-comments jobs: mint the bot App token, checkout the consumer repo, expose paths to the Python module and assets.'

inputs:
  app-id:
    description: 'tome-comments[bot] App ID'
    required: true
  app-private-key:
    description: 'tome-comments[bot] App private key (PEM)'
    required: true

outputs:
  app-token:
    description: 'Installation token minted for tome-comments[bot].'
    value: ${{ steps.app-token.outputs.token }}
  app-slug:
    description: 'App slug (used to derive the bot login).'
    value: ${{ steps.app-token.outputs.app-slug }}
  python-path:
    description: 'Absolute path to the process_tome_comments Python source tree. Use as PYTHONPATH.'
    value: ${{ steps.paths.outputs.python-path }}
  prelude-path:
    description: 'Absolute path to the standing-instructions prelude markdown.'
    value: ${{ steps.paths.outputs.prelude-path }}
  profile-path:
    description: 'Absolute path to the nono sandbox profile.'
    value: ${{ steps.paths.outputs.profile-path }}
  requirements-path:
    description: 'Absolute path to the Python requirements file.'
    value: ${{ steps.paths.outputs.requirements-path }}

runs:
  using: 'composite'
  steps:
    - name: Mint App token
      id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}

    - name: Resolve asset paths
      id: paths
      shell: bash
      # `${{ github.action_path }}` inside a composite's `outputs.<n>.value`
      # block evaluates to empty by the time the output is propagated to the
      # caller — observed as `PYTHONPATH: /../src` on a real run. The
      # `$GITHUB_ACTION_PATH` env var inside a `run:` step, however, correctly
      # resolves to this composite's on-disk location, so we compute the
      # absolute paths here and surface them via $GITHUB_OUTPUT.
      run: |
        BASE="$(cd "$GITHUB_ACTION_PATH/.." && pwd)"
        {
          echo "python-path=$BASE/src"
          echo "prelude-path=$BASE/prompt/prelude.md"
          echo "profile-path=$BASE/profiles/pi.json"
          echo "requirements-path=$BASE/requirements.txt"
        } >> "$GITHUB_OUTPUT"

    - name: Checkout consumer repo (App token)
      uses: actions/checkout@v4
      with:
        token: ${{ steps.app-token.outputs.token }}
        # Pin to the workflow's commit SHA. Without it, checkout@v4 invoked
        # inside a composite picks up GITHUB_ACTION_REF (the inner checkout
        # action's own ref, `v4`) and tries to fetch a `v4*` branch from
        # the consumer repo.
        ref: ${{ github.sha }}
        fetch-depth: 1
